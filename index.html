    <script>
      // Legacy redirect: this GitHub Pages site is frozen. The live app now
      // runs on AWS Amplify. Visitors on the old github.io host are
      // redirected to the new domain, preserving their route.
      // Runs on the legacy host ONLY, so it is inert on the Amplify domain.
      (function () {
        var NEW_ORIGIN = 'https://infinityworkshop.autovrse.app';
        if (!window.location.hostname.endsWith('github.io')) return;

        // Old site uses hash routing under a subpath, e.g.
        //   /infinity-workshop-frontend/#/assets/123?x=1
        // The hash holds the real route. Strip the leading '#', keep the rest.
        var hash = window.location.hash || '';
        var route = hash.replace(/^#/, ''); // -> "/assets/123?x=1" or ""
        if (route && route.charAt(0) !== '/') {
          route = '/' + route;
        }
        var target = NEW_ORIGIN + (route || '/');
        // replace() so the old URL isn't kept in history.
        window.location.replace(target);
      })();
    </script>
