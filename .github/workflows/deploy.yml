name: Deploy to GitHub Pages

# NOTE: GitHub Pages is kept as a FROZEN/LEGACY snapshot.
# The live site is now hosted on AWS Amplify at
# https://infinityworkshop.autovrse.app/
# Auto-deploy on push has been disabled on purpose. This workflow can only be
# run manually (Actions tab -> "Deploy to GitHub Pages" -> "Run workflow").
on:
  workflow_dispatch:
  # Auto-deploy on push to main is intentionally disabled (Pages is locked).
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install and Build 🔧
        run: |
          npm install --registry=https://registry.npmjs.org/
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
